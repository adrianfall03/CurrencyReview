name: Fetch Mizuho CSV

on:
  schedule:
    # Weekdays at 03:00 UTC (12:00 JST) — after Mizuho updates their file
    - cron: '0 3 * * 1-5'
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: write # needed to commit the last-sync timestamp (see below)

jobs:
  fetch-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install script dependencies
        run: npm install playwright @vercel/blob

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Download Mizuho CSV and upload to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/sync-mizuho.mjs

      # GitHub auto-disables scheduled workflows after 60 days without any
      # repository activity (commits/pushes). This job never pushes anything
      # on its own, so the repo looked "inactive" and the cron got disabled
      # on 2026-07-13. Committing a small timestamp file each run keeps the
      # repo active so the schedule doesn't silently stop firing again.
      - name: Record last successful sync
        run: |
          mkdir -p .github/sync-status
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/sync-status/mizuho-last-sync.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/sync-status/mizuho-last-sync.txt
          git diff --cached --quiet || git commit -m "chore: record Mizuho sync $(date -u +%Y-%m-%d)"
          git push
